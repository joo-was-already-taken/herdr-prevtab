id = "prevtab"
name = "PrevTab"
version = "0.2.1"
min_herdr_version = "0.7.0"
description = "Jump to the previously active tab"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[startup]]
command = ["target/release/herdr-prevtab", "rund"]

[[actions]]
id = "jump_back"
title = "Jump to the previously active tab"
contexts = ["workspace"]
command = ["target/release/herdr-prevtab", "jump-back"]

[[actions]]
id = "workspace_jump_back"
title = "Jump to the previously active workspace"
contexts = ["global"]
command = ["target/release/herdr-prevtab", "workspace-jump-back"]
